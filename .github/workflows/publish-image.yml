name: Publish image

# Builds the Dockerfile for amd64 and arm64 and pushes it to
# ghcr.io/<owner>/banjo on each release tag (#40). Release tags are protected
# (the "Protect release tags" ruleset), so an image tag can't silently change
# what it points at later.
#
# Each platform builds natively on its own runner, then one job merges the
# two into a multi-arch tag. Emulating arm64 with QEMU crashed Node in
# `npm ci` ("Illegal instruction") on the first release, v0.1.1.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/banjo

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # Pushed by digest only; the merge job below gives it its tags.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.1.1 -> 0.1.1 and latest. A manual run from a branch tags the
      # image with the branch name only, never latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create the multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(-t "$tag")
          done <<< "$TAGS"
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Inspect
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  # Only for a release tag: the GitHub Release, then the MCP Registry listing.
  # The registry checks the image's label against server.json, so this waits
  # for the image, and it signs in with this run's OIDC token (no secret).
  release:
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the image and manifests match the tag
        run: |
          version="${TAG#v}"
          for file in package.json server.json .claude-plugin/plugin.json; do
            found=$(jq -r .version "$file")
            [ "$found" = "$version" ] || { echo "::error::$file says $found, the tag says $version"; exit 1; }
          done
          platforms=$(docker buildx imagetools inspect "$IMAGE:$version" --raw \
            | jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(" ")')
          [ "$platforms" = "linux/amd64 linux/arm64" ] || { echo "::error::$IMAGE:$version has '$platforms'"; exit 1; }

      # Safe to re-run: an existing release is left as it is.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --verify-tag --generate-notes --latest
          fi

      - name: Install mcp-publisher
        run: |
          curl -sSfL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Check the listing
        run: |
          version="${TAG#v}"
          latest=$(curl -sSf "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.shatch/banjo" \
            | jq -r '.servers[] | select(.server.name == "io.github.shatch/banjo") | select(._meta."io.modelcontextprotocol.registry/official".isLatest) | .server.version')
          echo "Registry latest: $latest"
          [ "$latest" = "$version" ] || { echo "::error::the registry's latest is '$latest', not $version"; exit 1; }
