id: menu-on-hold
title: "Support line: a menu asks for a key while Banjo is on hold, then an agent gives a ticket and a window"
source: "Live cable-company support call, 2026-10-18 (paraphrased, fictional company; no real names or numbers)"
task:
  business: Northline Cable Support
  category: other
  goal: >-
    Report an intermittent internet outage (short drops on wired and Wi-Fi since yesterday, low downstream
    signal in the modem logs), get a ticket number, and book the earliest technician visit.
  mode: booking
  durationMinutes: 120
script:
  - ~Thank you for calling Northline Cable.
  - ~Para español, oprima dos.
  - ~Please hold while we connect you with the next available representative.
  - ~Your call is important to us. Please stay on the line.
  - ~We have chat agents available right now by text message. Press 1 to continue by text message on your mobile phone, otherwise press 3.
  - ~Please wait for the next available representative.
  - ~Hi, this is Morgan with Northline support. How can I help you today?
  - Okay, I see the drops. I've opened a ticket for you. The ticket number is 4417.
  - A technician can come {day+2} between 1 and 3 in the afternoon. Does that work?
  - You're all set. Anything else?
  - Thanks for calling Northline. Bye!
expect:
  status: [confirmed]
  answeredBy: [ivr]
  toolsCalled:
    - name: wait_on_hold
    - name: press_digits
      argsInclude: { digits: "3" }
  toolsNotCalled:
    - name: press_digits
      argsInclude: { digits: "1" }
    # 2 is Spanish; the chat menu's "stay on the line" is 3, so the two can't be confused.
    - name: press_digits
      argsInclude: { digits: "2" }
  bookedLocal: { dayOffset: 2, time: "13:00" }
  traceableNumbers: true
