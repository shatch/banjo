id: call-screening-pixel
title: "A Pixel's Call Screen asks why Banjo is calling, then the person picks up"
source: "#238: the screen's other common wording (paraphrased, fictional name)"
task:
  business: Marisol
  category: other
  goal: Check in with Marisol about dog-sitting next weekend and ask whether she's free.
  mode: conversation
  relationshipTier: friend
script:
  - The person you're calling is using a screening service and will get a copy of this conversation. Go ahead and say your name and why you're calling.
  - ~Thanks. Please stay on the line.
  - (silence 8)
  - ~Hi, this is Marisol. Who's this?
  - Oh sure, yes, I'm free next weekend. Happy to do it.
  - Great, thanks for checking. Bye!
expect:
  status: [conversation_completed]
  answeredBy: [ivr]
  toolsCalled:
    - name: wait_on_hold
  toolsNotCalled:
    - name: leave_voicemail_and_end_call
  reaches:
    - userLineIncludes: this is Marisol
skipUniversal:
  - check: disclosure_once
    reason: The screen hears the disclosure, and the person, who never heard it, hears it again when they pick up.
