services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: banjo
      POSTGRES_PASSWORD: banjo
      POSTGRES_DB: banjo
    ports:
      - '5432:5432'
    volumes:
      - banjo_postgres_data:/var/lib/postgresql/data

volumes:
  banjo_postgres_data:
