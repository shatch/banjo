services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: banjo
      POSTGRES_PASSWORD: banjo
      POSTGRES_DB: banjo
    ports:
      - '5432:5432'
    volumes:
      - banjo_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U banjo -d banjo']
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    # The published image for this release (#40). `docker compose up` pulls
    # it; `docker compose up --build` builds from this checkout instead and
    # tags the result the same way. Pin a version with BANJO_VERSION in .env.
    image: ghcr.io/shatch/banjo:${BANJO_VERSION:-latest}
    build: .
    restart: unless-stopped
    # node as PID 1 ignores SIGTERM, so without an init `docker compose down`
    # waits out the 10s grace period and then SIGKILLs.
    init: true
    env_file: .env
    environment:
      # .env's DATABASE_URL points at localhost for the `npm run dev` workflow;
      # inside the compose network Postgres answers to the service name.
      DATABASE_URL: postgresql://banjo:banjo@postgres:5432/banjo
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    # Owner profile (PROMPT_PROFILE_FILE=./banjo-profile.md in .env): mount it
    # read-only. Commented out because Docker creates a DIRECTORY at the host
    # path if the file doesn't exist yet. Uncomment here, or put it in a
    # git-ignored docker-compose.override.yml.
    # volumes:
    #   - ./banjo-profile.md:/app/banjo-profile.md:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Try Banjo without a phone: `OPENAI_API_KEY=sk-... docker compose run --rm sim`.
  # Banjo "calls" a business and you type as whoever answers (src/sim/cli.ts).
  # Needs no .env, no Twilio and no Node install: only Docker and an OpenAI key.
  # Options go on the end: `docker compose run --rm sim --mode ask`.
  # Behind a profile so `docker compose up` never starts it.
  sim:
    profiles: [sim]
    image: ghcr.io/shatch/banjo:${BANJO_VERSION:-latest}
    build: .
    init: true
    entrypoint: ['node', 'dist/sim/cli.js']
    # The image's healthcheck asks the app's /health, which the sim doesn't serve.
    healthcheck:
      disable: true
    environment:
      # Passed through from your shell, or from .env if you have one.
      - OPENAI_API_KEY
      # The sim swaps the database name for banjo_sim; it never touches `banjo`.
      - DATABASE_URL=postgresql://banjo:banjo@postgres:5432/banjo
      - BANJO_SIM_COMMAND=docker compose run --rm sim
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  banjo_postgres_data:
